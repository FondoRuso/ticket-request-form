name: Deploy to Yandex Object Storage

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: yandex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Must come before setup-node: `cache: 'pnpm'` needs pnpm on PATH.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Cache Puppeteer browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm caches build side effects, so a cache hit can restore puppeteer
      # already "built" and skip its postinstall — leaving no browser behind on
      # a green install. No-op once the cache above hits.
      - name: Ensure Chrome for prerender
        run: pnpm exec puppeteer browsers install chrome

      - name: Build SPA + prerender
        env:
          NOCODB_API_URL: ${{ secrets.NOCODB_API_URL }}
          NOCODB_REQUESTS_FORM_PUBLIC_UUID: ${{ secrets.NOCODB_REQUESTS_FORM_PUBLIC_UUID }}
          NOCODB_REQUESTS_VIEW_URL: ${{ secrets.NOCODB_REQUESTS_VIEW_URL }}
          DATA_BASE_URL: ${{ secrets.DATA_BASE_URL }}
          OPENPANEL_API_URL: ${{ secrets.OPENPANEL_API_URL }}
          OPENPANEL_CLIENT_ID: ${{ secrets.OPENPANEL_CLIENT_ID }}
        run: pnpm run build

      - name: Configure AWS CLI for Yandex Object Storage
        run: |
          aws configure set aws_access_key_id "${{ secrets.YC_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.YC_SECRET_ACCESS_KEY }}"
          aws configure set default.region ru-central1

      - name: Upload hashed assets (immutable, 1 year)
        run: |
          aws s3 sync dist/spa/assets s3://${{ secrets.YC_BUCKET_NAME }}/assets \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload other static files (short cache, 1 hour)
        run: |
          aws s3 sync dist/spa s3://${{ secrets.YC_BUCKET_NAME }}/ \
            --endpoint-url https://storage.yandexcloud.net \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=3600"

      - name: Upload index.html (no cache, always fresh)
        run: |
          aws s3 cp dist/spa/index.html s3://${{ secrets.YC_BUCKET_NAME }}/index.html \
            --endpoint-url https://storage.yandexcloud.net \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"
