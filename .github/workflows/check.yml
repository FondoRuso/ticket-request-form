name: Check

on:
  pull_request:
  push:

jobs:
  check:
    name: check:${{ matrix.script }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script: [format, code]
    steps:
      - uses: actions/checkout@v7
      # Must come before setup-node: `cache: 'pnpm'` needs pnpm on PATH.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      # Only the build needs a browser; downloading one per lint job is wasted time.
      - run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
      - run: pnpm run check:${{ matrix.script }}
